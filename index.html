<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>シンプル ToDo リスト</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#667eea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ToDo" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>📝 ToDo リスト</h1>

    <div class="sync-bar">
      <button id="sync-connect" class="sync-btn">🔗 Google Drive と同期</button>
      <button id="sync-now" class="sync-btn hidden">🔄 今すぐ同期</button>
      <button id="sync-disconnect" class="sync-btn ghost hidden">切断</button>
      <span id="sync-status" class="sync-status"></span>
    </div>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="やることを入力..."
        autocomplete="off"
        required
      />
      <input
        type="date"
        id="todo-date"
        class="todo-date"
        aria-label="期限"
        title="期限（任意）"
      />
      <button type="submit" class="add-btn">追加</button>
    </form>

    <section id="today-section" class="today-section">
      <h2 class="today-title">
        🔥 今日やること <span id="today-count" class="badge today-badge"></span>
      </h2>
      <ul id="today-list" class="todo-list"></ul>
    </section>

    <div class="columns">
      <section class="column">
        <h2 class="column-title">未完了 <span id="active-count" class="badge"></span></h2>
        <ul id="active-list" class="todo-list"></ul>
        <p id="active-empty" class="empty-msg">タスクはありません 🎉</p>
      </section>

      <section class="column">
        <h2 class="column-title">完了 <span id="done-count" class="badge"></span></h2>
        <ul id="done-list" class="todo-list"></ul>
        <p id="done-empty" class="empty-msg">まだありません</p>
      </section>
    </div>

    <footer class="footer">
      <span id="count"></span>
      <button id="clear-done" class="clear-btn">完了済みを削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
  <script src="config.js"></script>
  <script src="drive-sync.js"></script>
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <script>
    // セキュアな環境（https または localhost）でのみ Service Worker を登録
    if ("serviceWorker" in navigator && window.isSecureContext) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .catch((err) => console.warn("SW 登録に失敗:", err));
      });
    }
  </script>
</body>
</html>

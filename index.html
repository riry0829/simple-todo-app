<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプル ToDo リスト</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>📝 ToDo リスト</h1>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="やることを入力..."
        autocomplete="off"
        required
      />
      <button type="submit" class="add-btn">追加</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-msg" class="empty-msg">タスクはありません 🎉</p>

    <footer class="footer">
      <span id="count"></span>
      <button id="clear-done" class="clear-btn">完了済みを削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
